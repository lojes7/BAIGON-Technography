// 百工谱 — crawler_service 接口定义
// 多源数据采集服务

syntax = "proto3";

package baigon.crawler;

option java_package = "com.baigon.crawler";
option java_multiple_files = true;
option go_package = "baigon-technography/proto/gen/crawler;crawler";

import "common/evidence.proto";

service CrawlerService {
  // 采集数据
  rpc Crawl (CrawlRequest) returns (CrawlResponse) {}

  // 查询采集状态
  rpc GetCrawlStatus (GetCrawlStatusRequest) returns (GetCrawlStatusResponse) {}

  // 停止采集
  rpc StopCrawl (StopCrawlRequest) returns (StopCrawlResponse) {}

  // 按 trace_id 查询原始岗位记录（供 data-source 追溯 job_sources 表）
  rpc GetJobSourceByTraceId (GetJobSourceByTraceIdRequest) returns (GetJobSourceByTraceIdResponse) {}
}

message CrawlRequest {
  string type = 1; // 采集数据类型，为枚举值，目前暂时仅支持 `JOB`
  string trace_id = 2; // 链路追踪 ID（gateway RequestID 生成，透传全链路）
  int64 user_id = 3; // 用户 ID（gateway 从 JWT 解析，透传供日志/审计）
  string user_name = 4; // 登录账号 uid（gateway 从 JWT 解析）
  string user_ip = 5; // 客户端 IP（gateway 获取）
  string request_method = 6; // 原始 HTTP 方法（GET/POST/...）
  string request_url = 7; // 原始 HTTP 路径
  repeated string categories = 8; // 要爬的岗位分类（ADMIN 前端传参），空=全部
  int32 max_documents = 10; // 单分类最大条数（ADMIN 前端传参），默认 1000
}

message CrawlResponse {
  string count = 1; // 采集到的内容的数量
  string trace_id = 2; // 回显链路追踪 ID
  string status = 3; // 异步任务状态：running（已启动后台爬取）
}

message GetCrawlStatusRequest {
  string trace_id = 1; // 链路追踪 ID
  int64 user_id = 2; // 用户 ID（gateway 透传）
  string user_name = 3; // 登录账号 uid
  string user_ip = 4; // 客户端 IP
  string request_method = 5; // 原始 HTTP 方法
  string request_url = 6; // 原始 HTTP 路径
}

message GetCrawlStatusResponse {
  string status = 1; // 采集状态：idle / running / stopping / success / failed / stopped
  string count = 2; // 最近一次采集数量
  string message = 3; // 附加信息（如失败原因）
  string current_category = 4; // 正在爬取的分类
  int32 progress = 5; // 当前分类已完成页数
  int64 total_cleaned = 6; // 累计清洗条数
}

message StopCrawlRequest {
  string trace_id = 1; // 链路追踪 ID
  int64 user_id = 2; // 用户 ID（gateway 透传）
  string user_name = 3; // 登录账号 uid
  string user_ip = 4; // 客户端 IP
  string request_method = 5; // 原始 HTTP 方法
  string request_url = 6; // 原始 HTTP 路径
}

message StopCrawlResponse {
  string status = 1; // 停止后状态，stub 阶段固定返回 "stopped"
}

message GetJobSourceByTraceIdRequest {
  int64 trace_id = 1; // job_sources.trace_id
  // 审计字段（gateway 透传，供后端写 logs 表）
  int64 user_id = 2;
  string user_name = 3;
  string user_ip = 4;
  string request_method = 5;
  string request_url = 6;
}

message GetJobSourceByTraceIdResponse {
  // job_sources 全字段（与表结构一一对应）
  int64 id = 1;
  int64 trace_id = 2;
  string publish_date = 3; // ISO8601 时间
  string source_platform = 4;
  string source_url = 5;
  string city = 6;
  string tags = 7;
  string major = 8;
  string nature = 9;
  string salary = 10;
  string job_name = 11;
  string company_name = 12;
  string company_size = 13;
  string province = 14;
  string education = 15;
  string experience = 16;
  string job_description = 17;
  string clean_status = 18; // PENDING / SUCCESS / FAILED
}
