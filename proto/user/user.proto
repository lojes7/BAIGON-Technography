// 百工谱 — 用户域接口定义（由 occupation-service 承载）
// 用户管理、人岗匹配、简历解析、能力诊断、学习路径推荐

syntax = "proto3";

package baigon.user;

option java_package = "com.baigon.user";
option java_multiple_files = true;
option go_package = "baigon-technography/proto/gen/user;userpb";

// 用户服务：认证与用户管理
service UserService {
  // 登录：校验账号密码，签发 JWT
  rpc Login(LoginRequest) returns (LoginResponse);

  // ADMIN 分页查询用户基础信息。
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // 按用户 ID 查询账号与校园资料，gateway 用于本人和 ADMIN 查询。
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // 为当前用户签发 MinIO 预签名上传地址，文件不经过 gateway 或 gRPC。
  rpc CreateResumeUpload(CreateResumeUploadRequest) returns (CreateResumeUploadResponse);

  // 前端直传 MinIO 后确认上传；服务同步创建记录并提取文字。
  rpc CompleteResumeUpload(CompleteResumeUploadRequest) returns (CompleteResumeUploadResponse);

  // 当前用户查询自己的简历。
  rpc GetMyResume(GetMyResumeRequest) returns (GetMyResumeResponse);

  // 当前用户提交人工编辑的完整简历字段，保存为一条不绑定文件的新记录。
  rpc EditMyResume(EditMyResumeRequest) returns (EditMyResumeResponse);

  // ADMIN 按用户 ID 封禁账号。
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);

  // ADMIN 按用户 ID 解封账号。
  rpc UnlockUser(UnlockUserRequest) returns (UnlockUserResponse);

  // ADMIN 查询系统中的高校、学院和系部目录。
  rpc ListUniversities(OrganizationListRequest) returns (OrganizationListResponse);
  rpc ListSchools(OrganizationListRequest) returns (OrganizationListResponse);
  rpc ListDepartments(OrganizationListRequest) returns (OrganizationListResponse);
}

// 登录请求
message LoginRequest {
  string uid = 1;      // 登录账号
  string password = 2; // 密码（链路内加密）
}

// 登录响应
message LoginResponse {
  string token = 1;    // JWT，后续请求放入 Authorization: Bearer <token>
  int64 user_id = 2;   // 用户 ID
  string uid = 3;      // 登录账号
  string name = 4;     // 显示名称
  string role = 5;     // 角色
}

// 用户分页筛选请求；文本字段为空、组织 ID 为 0 时不参与筛选。
message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string name = 3;
  string role = 4;
  reserved 5, 6, 7;
  reserved "university", "school", "department";
  int64 university_id = 8;
  int64 school_id = 9;
  int64 department_id = 10;

  string trace_id = 20;
  int64 user_id = 21;
  string user_name = 22;
  string user_ip = 23;
  string request_method = 24;
  string request_url = 25;
}

// 用户详情请求。
message GetUserRequest {
  int64 id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// ADMIN 封禁用户请求。
message BlockUserRequest {
  int64 id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// ADMIN 解封用户请求。
message UnlockUserRequest {
  int64 id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 组织目录分页请求。parent_id 为 0 时返回全量；学院对应高校 ID，系部对应学院 ID。
message OrganizationListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int64 parent_id = 4;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message OrganizationData {
  int64 id = 1;
  string name = 2;
}

// 用户字段；密码永不进入公开契约。
message UserData {
  int64 id = 1;
  string uid = 2;
  string name = 3;
  string role = 4;
  string status = 5;
  string university_name = 6;
  string school_name = 7;
  string department_name = 8;
  int64 university_id = 9;
  int64 school_id = 10;
  int64 department_id = 11;
}

message ListUsersResponse {
  repeated UserData items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetUserResponse {
  UserData user = 1;
}

message BlockUserResponse {
  UserData user = 1;
}

message UnlockUserResponse {
  UserData user = 1;
}

message OrganizationListResponse {
  repeated OrganizationData items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 预签名上传申请；file_size 仅用于上传前校验，完成时仍会以 MinIO 实际对象为准。
message CreateResumeUploadRequest {
  string file_name = 1;
  int64 file_size = 2;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message CompleteResumeUploadRequest {
  int64 upload_id = 1;
  string file_name = 2;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message GetMyResumeRequest {
  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 人工编辑请求直接传输 format.json 对应的 JSON，避免重复定义一套嵌套 protobuf。
message EditMyResumeRequest {
  optional string content = 1;
  string fields_json = 2;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 对外不暴露 MinIO bucket、object key 和文件摘要等内部存储字段。
message ResumeData {
  int64 id = 1;
  // EDITED 记录不绑定上传文件，因此文件字段允许为空。
  optional string file_name = 2;
  optional int64 file_size = 3;
  optional string content = 4;
  string created_at = 5;
  // occupation-service 校验并规范化后的完整 format.json 对象。
  string fields_json = 6;
  string source = 7;
  reserved 8, 9, 10;
}

message CreateResumeUploadResponse {
  int64 upload_id = 1;
  string upload_url = 2;
  string method = 3;
  string content_type = 4;
  string expires_at = 5;
}

message CompleteResumeUploadResponse {
  ResumeData resume = 1;
}

message GetMyResumeResponse {
  ResumeData resume = 1;
}

message EditMyResumeResponse {
  ResumeData resume = 1;
}
