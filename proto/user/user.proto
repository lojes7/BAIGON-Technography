// 百工谱 — 用户域接口定义（由 occupation-service 承载）
// 用户管理、人岗匹配、简历解析、能力诊断、学习路径推荐

syntax = "proto3";

package baigon.user;

option java_package = "com.baigon.user";
option java_multiple_files = true;
option go_package = "baigon-technography/proto/gen/user;userpb";

// 用户服务：认证与用户管理
service UserService {
  // 登录：校验账号密码，签发 JWT
  rpc Login(LoginRequest) returns (LoginResponse);

  // ADMIN 分页查询用户基础信息。
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // 按用户 ID 查询账号与校园资料，gateway 用于本人和 ADMIN 查询。
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // ADMIN 按 ID 批量查询用户详情；列表接口仅返回 ID，由调用方按需补齐详情。
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);

  // 为当前用户签发 MinIO 预签名上传地址，文件不经过 gateway 或 gRPC。
  rpc CreateResumeUpload(CreateResumeUploadRequest) returns (CreateResumeUploadResponse);

  // 前端直传 MinIO 后确认上传；服务同步创建记录并提取文字。
  rpc CompleteResumeUpload(CompleteResumeUploadRequest) returns (CompleteResumeUploadResponse);

  // 当前用户查询自己的简历。
  rpc GetMyResume(GetMyResumeRequest) returns (GetMyResumeResponse);

  // 当前用户提交人工编辑的完整简历字段，保存为一条不绑定文件的新记录。
  rpc EditMyResume(EditMyResumeRequest) returns (EditMyResumeResponse);

  // 使用当前用户最新简历识别技能，并保存本次技能快照。
  rpc AnalyzeMyResumeSkills(AnalyzeMyResumeSkillsRequest) returns (AnalyzeMyResumeSkillsResponse);

  // 查询当前用户按识别时间保留的全部技能记录。
  rpc ListMySkills(ListMySkillsRequest) returns (ListMySkillsResponse);

  // 当前用户按记录 ID 查询自己的单条技能详情。
  rpc GetMySkill(GetMySkillRequest) returns (GetMySkillResponse);

  // 当前用户按记录 ID 批量查询自己的技能详情。
  rpc BatchGetMySkills(BatchGetMySkillsRequest) returns (BatchGetMySkillsResponse);

  // 使用当前用户最新简历与指定 jobs 记录进行人岗匹配。
  rpc MatchMyResumeToJob(MatchMyResumeToJobRequest) returns (MatchMyResumeToJobResponse);

  // 当前用户按岗位 ID 查询自己的最新一次人岗匹配。
  rpc GetLatestMyJobMatch(GetLatestMyJobMatchRequest) returns (MatchMyResumeToJobResponse);

  // ADMIN 按用户 ID 封禁账号。
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);

  // ADMIN 按用户 ID 解封账号。
  rpc UnlockUser(UnlockUserRequest) returns (UnlockUserResponse);

  // ADMIN 查询系统中的高校、学院和系部目录。
  rpc ListUniversities(OrganizationListRequest) returns (OrganizationListResponse);
  rpc ListSchools(OrganizationListRequest) returns (OrganizationListResponse);
  rpc ListDepartments(OrganizationListRequest) returns (OrganizationListResponse);
  rpc BatchGetUniversities(OrganizationBatchRequest) returns (OrganizationBatchResponse);
  rpc BatchGetSchools(OrganizationBatchRequest) returns (OrganizationBatchResponse);
  rpc BatchGetDepartments(OrganizationBatchRequest) returns (OrganizationBatchResponse);
}

// 登录请求
message LoginRequest {
  string uid = 1;      // 登录账号
  string password = 2; // 密码（链路内加密）
}

// 登录响应
message LoginResponse {
  string token = 1;    // JWT，后续请求放入 Authorization: Bearer <token>
  int64 user_id = 2;   // 用户 ID
  reserved 3, 4, 5;
  reserved "uid", "name", "role";
}

// 用户分页筛选请求；文本字段为空、组织 ID 为 0 时不参与筛选。
message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string name = 3;
  string role = 4;
  reserved 5, 6, 7;
  reserved "university", "school", "department";
  int64 university_id = 8;
  int64 school_id = 9;
  int64 department_id = 10;

  string trace_id = 20;
  int64 user_id = 21;
  string user_name = 22;
  string user_ip = 23;
  string request_method = 24;
  string request_url = 25;
}

// 用户详情请求。
message GetUserRequest {
  int64 id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// ADMIN 批量查询用户详情；最多 200 个 ID。
message BatchGetUsersRequest {
  repeated int64 ids = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// ADMIN 封禁用户请求。
message BlockUserRequest {
  int64 id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// ADMIN 解封用户请求。
message UnlockUserRequest {
  int64 id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 组织目录分页请求。parent_id 为 0 时返回全量；学院对应高校 ID，系部对应学院 ID。
message OrganizationListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int64 parent_id = 4;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 组织目录批量详情请求；具体组织类型由 RPC 决定。
message OrganizationBatchRequest {
  repeated int64 ids = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message OrganizationData {
  int64 id = 1;
  string name = 2;
  // 学院为 university_id，系部为 school_id；高校没有父级时为 0。
  int64 parent_id = 3;
}

// 用户字段；密码永不进入公开契约。
message UserData {
  int64 id = 1;
  string uid = 2;
  string name = 3;
  string role = 4;
  string status = 5;
  reserved 6, 7, 8;
  reserved "university_name", "school_name", "department_name";
  int64 university_id = 9;
  int64 school_id = 10;
  int64 department_id = 11;
}

message ListUsersResponse {
  reserved 1;
  reserved "items";
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  repeated int64 user_ids = 5;
}

message GetUserResponse {
  UserData user = 1;
}

message BatchGetUsersResponse {
  repeated UserData items = 1;
  repeated int64 missing_ids = 2;
}

message BlockUserResponse {
  reserved 1;
  reserved "user";
  int64 user_id = 2;
}

message UnlockUserResponse {
  reserved 1;
  reserved "user";
  int64 user_id = 2;
}

message OrganizationListResponse {
  reserved 1;
  reserved "items";
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  repeated int64 organization_ids = 5;
}

message OrganizationBatchResponse {
  repeated OrganizationData items = 1;
  repeated int64 missing_ids = 2;
}

// 预签名上传申请；file_size 仅用于上传前校验，完成时仍会以 MinIO 实际对象为准。
message CreateResumeUploadRequest {
  string file_name = 1;
  int64 file_size = 2;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message CompleteResumeUploadRequest {
  int64 upload_id = 1;
  string file_name = 2;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message GetMyResumeRequest {
  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 人工编辑请求直接传输 format.json 对应的 JSON，避免重复定义一套嵌套 protobuf。
message EditMyResumeRequest {
  optional string content = 1;
  string fields_json = 2;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 对外不暴露 MinIO bucket、object key 和文件摘要等内部存储字段。
message ResumeData {
  int64 id = 1;
  // EDITED 记录不绑定上传文件，因此文件字段允许为空。
  optional string file_name = 2;
  optional int64 file_size = 3;
  optional string content = 4;
  string created_at = 5;
  // occupation-service 校验并规范化后的完整 format.json 对象。
  string fields_json = 6;
  string source = 7;
  reserved 8, 9, 10;
}

message CreateResumeUploadResponse {
  int64 upload_id = 1;
  string upload_url = 2;
  string method = 3;
  string content_type = 4;
  string expires_at = 5;
}

message CompleteResumeUploadResponse {
  reserved 1;
  reserved "resume";
  int64 resume_id = 2;
}

message GetMyResumeResponse {
  ResumeData resume = 1;
}

message EditMyResumeResponse {
  reserved 1;
  reserved "resume";
  int64 resume_id = 2;
}

// 简历技能分析只依赖服务端确定的当前用户和最新简历，不接收客户端正文或简历 ID。
message AnalyzeMyResumeSkillsRequest {
  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 技能时间线查询仅使用 gateway 透传的当前用户上下文。
message ListMySkillsRequest {
  int32 page = 1;
  int32 page_size = 2;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message GetMySkillRequest {
  int64 id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message BatchGetMySkillsRequest {
  repeated int64 ids = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 人岗匹配的唯一业务参数是 jobs.id；简历仍由服务端选取。
message MatchMyResumeToJobRequest {
  int64 job_id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 前端只提供岗位 ID；服务端使用当前用户 ID 查询该岗位的最新匹配结果。
message GetLatestMyJobMatchRequest {
  int64 job_id = 1;

  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

// 对外技能记录不包含内部任务、模型、trace 或简历正文。
message UserSkillData {
  int64 id = 1;
  int64 resume_id = 2;
  string skill_name = 3;
  string proficiency = 4;
  string evidence = 5;
  string created_at = 6;
}

message AnalyzeMyResumeSkillsResponse {
  int64 resume_id = 1;
  reserved 2;
  reserved "skills";
  repeated int64 user_skill_record_ids = 3;
}

message ListMySkillsResponse {
  reserved 1;
  reserved "items";
  repeated int64 user_skill_record_ids = 2;
  int64 total = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message GetMySkillResponse {
  UserSkillData skill = 1;
}

message BatchGetMySkillsResponse {
  repeated UserSkillData items = 1;
  repeated int64 missing_ids = 2;
}

message SkillLearningSuggestion {
  string skill_name = 1;
  string reason = 2;
  string suggestion = 3;
}

message MatchMyResumeToJobResponse {
  int64 resume_id = 1;
  int64 job_id = 2;
  int32 score = 3;
  string summary = 4;
  repeated SkillLearningSuggestion skills_to_learn = 5;
  repeated string action_suggestions = 6;
  string created_at = 7;
  int64 id = 8;
}
