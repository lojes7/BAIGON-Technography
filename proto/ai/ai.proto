// 百工谱 — ai_service 接口定义
// LLM 结构化抽取、文本嵌入、语义归一

syntax = "proto3";

package baigon.ai;

option java_package = "com.baigon.ai";
option java_multiple_files = true;
option go_package = "baigon-technography/proto/gen/ai;aipb";

// ==================== 服务定义 ====================

service AIService {
  // 使用星火模型分析单条 JD，返回经过严格校验的技能对象列表。
  rpc AnalyzeJobDescription(AnalyzeJobDescriptionRequest) returns (AnalyzeJobDescriptionResponse) {}

  // 从 OCR 简历原文抽取结构化信息，业务结果只返回经过格式和来源校验的 JSON。
  rpc AnalyzeResume(AnalyzeResumeRequest) returns (AnalyzeResumeResponse) {}

  // 从当前用户的简历正文中提取有原文证据的技能。
  rpc AnalyzeUserSkills(AnalyzeUserSkillsRequest) returns (AnalyzeUserSkillsResponse) {}

  // 只使用简历五组结构化字段和 jobs 表公开业务字段完成人岗匹配。
  rpc AnalyzeJobMatch(AnalyzeJobMatchRequest) returns (AnalyzeJobMatchResponse) {}

  // 生成单条文本嵌入向量。
  rpc EmbedText(EmbedTextRequest) returns (EmbedTextResponse) {}

  // 批量生成文本嵌入向量，返回顺序与输入 texts 保持一致。
  rpc BatchEmbedText(BatchEmbedTextRequest) returns (BatchEmbedTextResponse) {}
}

message AnalyzeJobDescriptionRequest {
  string jd = 1;
}

message AnalyzeJobDescriptionResponse {
  // 服务端完成 JSON 解析和校验后再构造强类型响应。
  reserved 1;
  reserved "analysis_json";
  repeated AnalyzedSkill skills = 2;
  // 供应商返回的原始助手消息，仅供内部分析任务审查，不对外暴露。
  string source_llm_response = 3;
  // 空字符串表示成功；非空时调用方必须把对应任务标记为 FAILED。
  string error_code = 4;
}

message AnalyzedSkill {
  // 技能名称优先使用中文；技术或产品专名可保留英文。
  string name = 1;
  string proficiency = 2;
  string evidence = 3;
}

message AnalyzeResumeRequest {
  // OCR 提取出的完整简历原文，不接收文件或对象存储地址。
  string content = 1;
}

message AnalyzeResumeResponse {
  // 形状与 format.json 完全一致，且所有非空内容均经过原文来源校验。
  string resume_json = 1;
  // 以下两项只供内部任务审查；不得映射到公开简历响应。
  string source_llm_response = 2;
  string error_code = 3;
}

message AnalyzeUserSkillsRequest {
  // 当前用户最新简历的完整正文。
  string resume_content = 1;

  // 调用链审计字段：由 gateway 经 occupation-service 透传。
  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message AnalyzeUserSkillsResponse {
  repeated AnalyzedSkill skills = 1;
  string model = 2;
  // 原始响应和校验错误只由 occupation-service 消费并写任务表。
  string source_llm_response = 3;
  string error_code = 4;
}

message AnalyzeJobMatchRequest {
  // 旧版简历正文不再用于人岗匹配，避免 EDITED 简历 content 为空时无法分析。
  reserved 1;
  reserved "resume_content";
  // 岗位快照只允许由 jobs 表的公开业务字段构造。
  JobMatchProfile job = 2;
  // 当前用户最新简历的五组 JSONB 结构化字段。
  ResumeMatchProfile resume = 3;

  // 调用链审计字段：由 gateway 经 occupation-service 透传。
  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message ResumeMatchProfile {
  // 以下字段分别是 resumes 对应 JSONB 数组的规范 JSON 文本。
  string education_experiences = 1;
  string work_experiences = 2;
  string project_experiences = 3;
  string professional_skills = 4;
  string awards = 5;
}

message JobMatchProfile {
  string name = 1;
  string publish_date = 2;
  string source_platform = 3;
  string source_url = 4;
  string tags = 5;
  string major = 6;
  string nature = 7;
  string salary = 8;
  string company_name = 9;
  string company_size = 10;
  string city = 11;
  string province = 12;
  string education = 13;
  string experience = 14;
  string job_description = 15;
  // jobs.occupation_id 为空时由 proto3 零值 0 表示。
  int64 occupation_id = 16;
}

message AnalyzeJobMatchResponse {
  int32 score = 1;
  string summary = 2;
  repeated SkillLearningSuggestion skills_to_learn = 3;
  repeated string action_suggestions = 4;
  string model = 5;
  // 原始响应和校验错误不属于面向用户的匹配结果。
  string source_llm_response = 6;
  string error_code = 7;
}

message SkillLearningSuggestion {
  string skill_name = 1;
  string reason = 2;
  string suggestion = 3;
}

message EmbedTextRequest {
  string text = 1;
  // 0 表示使用服务默认维度（当前 Qwen 配置为 1024）。
  uint32 dimensions = 2;

  // 调用链审计字段：由 gateway 或上游服务透传。
  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message EmbedTextResponse {
  repeated float embedding = 1;
  uint32 dimensions = 2;
  string model = 3;
}

message BatchEmbedTextRequest {
  repeated string texts = 1;
  // 0 表示使用服务默认维度（当前 Qwen 配置为 1024）。
  uint32 dimensions = 2;
  // 0 表示使用服务默认批大小 20。
  uint32 chunk_size = 3;

  // 调用链审计字段：由 gateway 或上游服务透传。
  string trace_id = 10;
  int64 user_id = 11;
  string user_name = 12;
  string user_ip = 13;
  string request_method = 14;
  string request_url = 15;
}

message BatchEmbedTextResponse {
  repeated EmbeddingVector embeddings = 1;
  uint32 dimensions = 2;
  string model = 3;
}

message EmbeddingVector {
  repeated float values = 1;
}
