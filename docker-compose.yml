services:
  # ==================== 基础设施 ====================

  # Consul — 服务注册与发现
  consul:
    image: hashicorp/consul:${CONSUL_VERSION:-1.19}
    container_name: baigon-consul
    ports:
      - "${CONSUL_PORT}:8500"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baigon-net

  # Kafka — 单节点 KRaft（本地开发环境同时承担 broker 和 controller）
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: baigon-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      # 固定集群 ID，确保 Kafka 数据卷重建容器后仍可继续使用。
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - baigon-net

  # PostgreSQL 16 + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: baigon-postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # crawler_service 
      CRAWLER_DB_NAME: ${CRAWLER_DB_NAME}
      CRAWLER_DB_USER: ${CRAWLER_DB_USER}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD}

      # ai_service
      AI_DB_NAME: ${AI_DB_NAME}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}

      # occupation_service
      OCCUPATION_DB_NAME: ${OCCUPATION_DB_NAME}
      OCCUPATION_DB_USER: ${OCCUPATION_DB_USER}
      OCCUPATION_DB_PASSWORD: ${OCCUPATION_DB_PASSWORD}

      # user_service
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}

    volumes:
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - pgdata:/var/lib/postgresql/data
      - ./crawler/init.sql:/service-init/crawler_init.sql:ro
      - ./occupation/init.sql:/service-init/occupation/init.sql:ro
      - ./occupation/data.sql:/service-init/occupation/data.sql:ro
      - ./occupation/sql:/service-init/occupation/sql:ro
      - ./user/init.sql:/service-init/user_init.sql:ro
      - ./user/data.sql:/service-init/user_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baigon-net

  # MinIO — 通用对象存储基础设施
  minio:
    image: minio/minio:latest
    container_name: baigon-minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baigon-net

  # ==================== 业务服务 ====================

  frontend:
    build: ./frontend
    container_name: baigon-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - baigon-net

  # gateway_service — Go + GIN 网关
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: baigon-gateway-service
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      CONSUL_ADDR: consul:8500
      SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID_GATEWAY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - baigon-net

  # crawler_service — Python 爬虫服务
  # context 指向根目录：构建时需要 proto/ 中的接口定义（stub 在镜像内自动生成）
  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    container_name: baigon-crawler-service
    ports:
      - "${CRAWLER_GRPC_PORT}:50051"
    environment:
      CONSUL_ADDR: consul:8500
      SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID_CRAWLER}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${CRAWLER_DB_NAME}
      DB_USER: ${CRAWLER_DB_USER}
      DB_PASSWORD: ${CRAWLER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_PORT: 50051
      AI_SERVICE_NAME: ai-service
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - baigon-net

  # ai_service — Python AI 服务
  ai:
    # context 指向根目录：构建时需要 proto/ 中的接口定义（stub 在镜像内自动生成）
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: baigon-ai-service
    ports:
      - "${AI_GRPC_PORT}:50053"
    environment:
      CONSUL_ADDR: consul:8500
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${AI_DB_NAME}
      DB_USER: ${AI_DB_USER}
      DB_PASSWORD: ${AI_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_PORT: 50053
      SPARK_API_PASSWORD: ${SPARK_API_PASSWORD}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - baigon-net

  # occupation_service — Java 数据治理、职业目录与岗位分析合并服务
  occupation:
    # context 指向根目录：构建时需要 data-source、occupation、crawler 与 ai 接口定义
    build:
      context: .
      dockerfile: occupation/Dockerfile
    container_name: baigon-occupation-service
    ports:
      - "${OCCUPATION_GRPC_PORT}:50054"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID_OCCUPATION}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${OCCUPATION_DB_NAME}
      DB_USER: ${OCCUPATION_DB_USER}
      DB_PASSWORD: ${OCCUPATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_SERVICE_NAME: ai-service
      GRPC_PORT: 50054
      SERVER_PORT: 8082
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - baigon-net

  # user_service — Java 用户服务
  # context 指向根目录：构建时需要 proto/ 中的接口定义
  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: baigon-user-service
    ports:
      - "${USER_GRPC_PORT}:50055"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID_USER}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${USER_DB_NAME}
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_PORT: 50055
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - baigon-net

# ==================== 网络与数据卷 ====================
networks:
  baigon-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  kafkadata:
