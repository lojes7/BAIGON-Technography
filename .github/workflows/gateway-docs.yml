# 百工谱 — Gateway Swagger 文档自动生成 + GitHub Pages 部署
# push 到 main 或 PR 时，从代码注解生成 OpenAPI 文档并校验；
# push 到 main 时额外部署到 GitHub Pages，获得固定 URL 供团队在线浏览。
# 生成物（docs.go / swagger.json / swagger.yaml）不入库，构建前需重新生成

name: Swagger Docs Generation

# 触发：push 到 main + 所有 PR（仅 gateway 相关改动，避免无意义运行）
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-docs.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-docs.yml'

# 并发控制：同一分支新提交时取消旧运行，节省 CI 资源
concurrency:
  group: gateway-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== 生成与组装（所有触发） ====================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仅用于安装 swag CLI（swag init 是静态 AST 解析，不依赖 pb/生成物）
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod   # 读取 go.mod 中的 go 版本，不硬编码
          cache: true                        # 缓存 go module 下载

      # 固定版本，与 go.mod 中 swaggo/swag v1.16.6 一致，避免 @latest 漂移导致 CI 偶发失败
      - name: 安装 swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      # 从代码注解生成 OpenAPI 文档（gitignored，不入库）
      - name: 生成 Swagger 文档
        working-directory: gateway
        run: swag init -g cmd/main.go -o docs/

      # 校验生成结果：swagger.json 存在、合法、paths 非空
      - name: 校验生成结果
        working-directory: gateway
        run: |
          test -s docs/swagger.json
          jq -e '.paths | length > 0' docs/swagger.json > /dev/null
          echo "Swagger 文档生成成功: $(jq -r '.info.title' docs/swagger.json)"

      # 组装 GitHub Pages 静态页：swagger.json + Swagger UI 入口页
      # UI 资源走 unpkg CDN，部署目录仅 2 个文件
      - name: 组装 Pages 页面
        run: |
          mkdir -p public
          cp gateway/docs/swagger.json public/swagger.json
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>百工谱 Gateway API</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
            <script>
            window.onload = () => {
              window.ui = SwaggerUIBundle({
                url: './swagger.json',   // 相对路径，兼容 Pages 子路径 /BAIGON-Technography/
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
                layout: 'StandaloneLayout',
              });
            };
            </script>
          </body>
          </html>
          EOF

      # 上传 Pages artifact（供 deploy job 取用）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # ==================== 部署到 Pages（仅 push main） ====================
  deploy:
    needs: build
    # 只在 push 到 main 时部署，PR 只校验不发布
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
