# 百工谱 — occupation_service 配置
# Spring Boot + gRPC + Consul + PostgreSQL + Kafka

server:
  port: ${SERVER_PORT}

spring:
  application:
    name: occupation-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:baigon_occupation}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: occupation-service
  cloud:
    discovery:
      client:
        health-indicator:
          # Actuator 健康检查只探测 Consul 可用性，不读取完整服务目录。
          use-services-query: false
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        instance-id: ${spring.application.name}-${random.value}
        service-name: occupation-service
        port: ${GRPC_PORT}  # 注册端口必须与实际 gRPC 端口一致
        health-check-url: http://${HOSTNAME:localhost}:${server.port}/actuator/health
        health-check-interval: 10s
        # 本服务按需调用 DiscoveryClient，不需要轮询完整目录；同时避免旧客户端使用已弃用的 token 查询参数。
        catalog-services-watch:
          enabled: false

grpc:
  server:
    port: ${GRPC_PORT:50054}

ai:
  service-name: ${AI_SERVICE_NAME:ai-service}
  dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
  batch-size: ${AI_EMBEDDING_BATCH_SIZE:20}
  timeout-seconds: ${AI_GRPC_TIMEOUT_SECONDS:30}
  # 简历抽取是单次同步 LLM 调用，使用独立超时且不自动重试。
  resume-timeout-seconds: 120
  # 用户技能识别与人岗匹配均为单次同步 LLM 调用，不自动重试。
  user-analysis-timeout-seconds: 120
  
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.baigon: DEBUG
    org.springframework.cloud.consul: INFO

job-analysis:
  # 专业与职业共用候选上限；候选仅供参考，最终可选择任意有效目录记录。
  candidate-limit: 5

jwt:
  # 与 gateway 使用同一签名密钥；配置缺失时拒绝启动。
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRATION_HOURS}

minio:
  endpoint: ${MINIO_ENDPOINT}
  # 浏览器直传地址属于应用配置
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  region: ${MINIO_REGION}
  resume-bucket: ${MINIO_RESUME_BUCKET}

resume:
  # 上传前校验声明大小，完成时再按 MinIO 对象实际大小复核。
  max-file-size-bytes: ${RESUME_MAX_FILE_SIZE_BYTES:10485760}
  max-pdf-pages: 10
  upload-url-expiry-seconds: ${RESUME_UPLOAD_URL_EXPIRY_SECONDS:600}

ocr:
  command: tesseract
  languages: chi_sim+eng
  page-dpi: 200
  timeout-seconds: 30
